# ============================================================
# Configuracion de conexion a MySQL
# ============================================================
# La aplicacion usa la base sigh_gr02, creada al importar el DDL
# completo SIGH_GR02_MySQL_DDL en MySQL Workbench.
# Los usuarios de prueba se cargan con:
#   database/02_seguridad_datos_prueba.sql
#
# Si tu usuario root tiene contrasena, escribela en db.password.
# Si MySQL usa otro puerto, cambia 3306 en db.url.
#
# Tambien puedes sobrescribir estos valores con las variables de
# entorno DB_URL, DB_USER, DB_PASSWORD y DB_DRIVER.
# ============================================================

db.url=jdbc:mysql://localhost:3306/sigh_gr02?useUnicode=true&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Guayaquil
db.user=root
db.password=root
db.driver=com.mysql.cj.jdbc.Driver
