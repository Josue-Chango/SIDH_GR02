<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 935" role="img"><title>Historia clínica y atención  |  Catálogo general</title><desc>Vista parcial del mismo sujeto SIGH. Las seis vistas cubren los 23 casos del catálogo sin alterar su numeración. Las asociaciones agregan la participación en el detalle; no conceden permisos de todo el módulo. Autorización contextual y registro de accesos son reglas de todas las consultas. Una asociación de auditoría no concede edición ni acceso clínico indiscriminado. El episodio existente es precondición de los registros que lo requieren. Abrir, documentar, evolucionar y finalizar no se enlazan mediante include para representar su orden temporal. Se elimina Alertar valores críticos como objetivo del alcance base: no existe requisito que defina ni apruebe ese motor clínico. Las alertas de inventario de RF-FAR-007 sí se conservan en CU-16. La admisión administrativa, el triaje y la atención clínica tienen responsables distintos. La conciliación de identidad puede ocurrir después y no se fuerza como include del ingreso. El alta médica y el egreso administrativo son operaciones distintas. CU-17 conserva la actualización operativa de camas y los estados de limpieza o preparación.</desc><defs><marker id="arrow" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M1,1 L10,5 L1,9" fill="none" stroke="#334155" stroke-width="1.3"/></marker></defs><rect width="100%" height="100%" fill="white"/><rect x="345" y="100" width="950" height="720" fill="white" stroke="#334155" stroke-width="1.6"/><polyline points="170,199 556.013,190" fill="none" stroke="#334155" stroke-width="1.3"/><polyline points="1420,199 1100,205" fill="none" stroke="#334155" stroke-width="1.3"/><polyline points="1420,199 1100,475" fill="none" stroke="#334155" stroke-width="1.3"/><polyline points="1420,199 1096.08,602.507" fill="none" stroke="#334155" stroke-width="1.3"/><polyline points="170,469 556.013,220" fill="none" stroke="#334155" stroke-width="1.3"/><polyline points="170,469 540,340" fill="none" stroke="#334155" stroke-width="1.3"/><polyline points="170,469 543.92,617.493" fill="none" stroke="#334155" stroke-width="1.3"/><polyline points="170,469 540,745" fill="none" stroke="#334155" stroke-width="1.3"/><polyline points="1420,739 1062.49,587.493" fill="none" stroke="#334155" stroke-width="1.3"/><polyline points="170,739 577.507,632.507" fill="none" stroke="#334155" stroke-width="1.3"/><text fill="#223046" font-family="Arial,sans-serif" font-size="22" font-weight="700" text-anchor="middle"><tspan x="800" y="37.5">Historia clínica y atención | Catálogo general</tspan></text><text fill="#223046" font-family="Arial,sans-serif" font-size="16" font-weight="700" text-anchor="middle"><tspan x="820" y="129.5">SIGH | Hospital General Monster Salud</tspan></text><text fill="#223046" font-family="Arial,sans-serif" font-size="12" text-anchor="middle"><tspan x="800" y="870">Sesión y permisos válidos para operaciones protegidas. Las asociaciones no representan orden temporal.</tspan></text><circle cx="140" cy="175" r="11" fill="white" stroke="#334155" stroke-width="1.6"/><path d="M140,186 V212 M110,199 H170 M140,212 L115,236 M140,212 L165,236" fill="none" stroke="#334155" stroke-width="1.6"/><text fill="#223046" font-family="Arial,sans-serif" font-size="14" text-anchor="middle"><tspan x="140" y="262">Auditor</tspan></text><circle cx="1450" cy="175" r="11" fill="white" stroke="#334155" stroke-width="1.6"/><path d="M1450,186 V212 M1420,199 H1480 M1450,212 L1425,236 M1450,212 L1475,236" fill="none" stroke="#334155" stroke-width="1.6"/><text fill="#223046" font-family="Arial,sans-serif" font-size="14" text-anchor="middle"><tspan x="1450" y="262">Enfermero</tspan></text><circle cx="140" cy="445" r="11" fill="white" stroke="#334155" stroke-width="1.6"/><path d="M140,456 V482 M110,469 H170 M140,482 L115,506 M140,482 L165,506" fill="none" stroke="#334155" stroke-width="1.6"/><text fill="#223046" font-family="Arial,sans-serif" font-size="14" text-anchor="middle"><tspan x="140" y="532">Médico</tspan></text><circle cx="1450" cy="715" r="11" fill="white" stroke="#334155" stroke-width="1.6"/><path d="M1450,726 V752 M1420,739 H1480 M1450,752 L1425,776 M1450,752 L1475,776" fill="none" stroke="#334155" stroke-width="1.6"/><text fill="#223046" font-family="Arial,sans-serif" font-size="14" text-anchor="middle"><tspan x="1450" y="793.6">Responsable de admisión</tspan><tspan x="1450" y="810.4">hospitalaria</tspan></text><circle cx="140" cy="715" r="11" fill="white" stroke="#334155" stroke-width="1.6"/><path d="M140,726 V752 M110,739 H170 M140,752 L115,776 M140,752 L165,776" fill="none" stroke="#334155" stroke-width="1.6"/><text fill="#223046" font-family="Arial,sans-serif" font-size="14" text-anchor="middle"><tspan x="140" y="802">Recepcionista</tspan></text><ellipse cx="820" cy="205" rx="280" ry="45" fill="#eff6ff" stroke="#334155" stroke-width="1.4"/><text fill="#223046" font-family="Arial,sans-serif" font-size="15" text-anchor="middle"><tspan x="820" y="201">CU-07</tspan><tspan x="820" y="219">Consultar historia clínica electrónica</tspan></text><ellipse cx="820" cy="340" rx="280" ry="45" fill="#eff6ff" stroke="#334155" stroke-width="1.4"/><text fill="#223046" font-family="Arial,sans-serif" font-size="15" text-anchor="middle"><tspan x="820" y="336">CU-08</tspan><tspan x="820" y="354">Registrar consulta, diagnóstico y tratamiento</tspan></text><ellipse cx="820" cy="475" rx="280" ry="45" fill="#eff6ff" stroke="#334155" stroke-width="1.4"/><text fill="#223046" font-family="Arial,sans-serif" font-size="15" text-anchor="middle"><tspan x="820" y="471">CU-09</tspan><tspan x="820" y="489">Registrar signos vitales y cuidados</tspan></text><ellipse cx="820" cy="610" rx="280" ry="45" fill="#eff6ff" stroke="#334155" stroke-width="1.4"/><text fill="#223046" font-family="Arial,sans-serif" font-size="15" text-anchor="middle"><tspan x="820" y="606">CU-10</tspan><tspan x="820" y="624">Gestionar urgencias</tspan></text><ellipse cx="820" cy="745" rx="280" ry="45" fill="#eff6ff" stroke="#334155" stroke-width="1.4"/><text fill="#223046" font-family="Arial,sans-serif" font-size="15" text-anchor="middle"><tspan x="820" y="741">CU-19</tspan><tspan x="820" y="759">Registrar alta médica</tspan></text></svg>