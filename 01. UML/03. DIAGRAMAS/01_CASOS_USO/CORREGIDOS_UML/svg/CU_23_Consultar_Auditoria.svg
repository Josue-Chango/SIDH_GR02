<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 665" role="img"><title>CU-23  Consultar auditoría y trazabilidad</title><desc>La generación y protección de bitácoras son reglas transversales del sistema. No se presentan como tareas del auditor ni como actores internos.
RF-AUD-001: Registrar eventos definidos por la institución con usuario, fecha, tipo, objeto y resultado. Aplica a autenticación, permisos, accesos, cambios, validaciones, anulaciones y exportaciones.
RF-AUD-003: Impedir modificación o eliminación por usuarios ordinarios; la administración de registros exige controles adicionales.
RF-AUD-004: Registrar accesos denegados relevantes sin contraseñas ni secretos.</desc><defs><marker id="arrow" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M1,1 L10,5 L1,9" fill="none" stroke="#334155" stroke-width="1.3"/></marker></defs><rect width="100%" height="100%" fill="white"/><rect x="345" y="100" width="950" height="450" fill="white" stroke="#334155" stroke-width="1.6"/><polyline points="170,199 556.013,325" fill="none" stroke="#334155" stroke-width="1.3"/><polyline points="1420,334 1100,340" fill="none" stroke="#334155" stroke-width="1.3"/><polyline points="170,469 556.013,355" fill="none" stroke="#334155" stroke-width="1.3"/><text fill="#223046" font-family="Arial,sans-serif" font-size="22" font-weight="700" text-anchor="middle"><tspan x="800" y="37.5">CU-23 Consultar auditoría y trazabilidad</tspan></text><text fill="#223046" font-family="Arial,sans-serif" font-size="16" font-weight="700" text-anchor="middle"><tspan x="820" y="129.5">SIGH | Hospital General Monster Salud</tspan></text><text fill="#223046" font-family="Arial,sans-serif" font-size="12" text-anchor="middle"><tspan x="800" y="600">Sesión y permisos válidos para operaciones protegidas. Las asociaciones no representan orden temporal.</tspan></text><circle cx="140" cy="175" r="11" fill="white" stroke="#334155" stroke-width="1.6"/><path d="M140,186 V212 M110,199 H170 M140,212 L115,236 M140,212 L165,236" fill="none" stroke="#334155" stroke-width="1.6"/><text fill="#223046" font-family="Arial,sans-serif" font-size="14" text-anchor="middle"><tspan x="140" y="262">Administrador del sistema</tspan></text><circle cx="1450" cy="310" r="11" fill="white" stroke="#334155" stroke-width="1.6"/><path d="M1450,321 V347 M1420,334 H1480 M1450,347 L1425,371 M1450,347 L1475,371" fill="none" stroke="#334155" stroke-width="1.6"/><text fill="#223046" font-family="Arial,sans-serif" font-size="14" text-anchor="middle"><tspan x="1450" y="397">Auditor</tspan></text><circle cx="140" cy="44