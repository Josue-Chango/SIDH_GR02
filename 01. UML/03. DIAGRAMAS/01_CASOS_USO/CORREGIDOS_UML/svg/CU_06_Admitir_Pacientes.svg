<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1350 665" role="img"><title>CU-06  Admitir pacientes</title><desc>CU-06 se concreta como admisión administrativa. CU-17 se ocupa de camas y egreso; la llegada a consulta externa se registra en CU-05. La ERS no define un RF independiente para verificar cobertura externa.
</desc><defs><marker id="arrow" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M1,1 L10,5 L1,9" fill="none" stroke="#334155" stroke-width="1.3"/></marker></defs><rect width="100%" height="100%" fill="white"/><rect x="345" y="100" width="950" height="450" fill="white" stroke="#334155" stroke-width="1.6"/><polyline points="170,199 540,205" fill="none" stroke="#334155" stroke-width="1.3"/><polyline points="170,199 540,340" fill="none" stroke="#334155" stroke-width="1.3"/><polyline points="170,199 543.92,467.493" fill="none" stroke="#334155" stroke-width="1.3"/><polyline points="170,469 543.92,482.507" fill="none" stroke="#334155" stroke-width="1.3"/><text fill="#223046" font-family="Arial,sans-serif" font-size="22" font-weight="700" text-anchor="middle"><tspan x="675" y="37.5">CU-06 Admitir pacientes</tspan></text><text fill="#223046" font-family="Arial,sans-serif" font-size="16" font-weight="700" text-anchor="middle"><tspan x="820" y="129.5">SIGH | Hospital General Monster Salud</tspan></text><text fill="#223046" font-family="Arial,sans-serif" font-size="12" text-anchor="middle"><tspan x="675" y="600">Sesión y permisos válidos para operaciones protegidas. Las asociaciones no representan orden temporal.</tspan></text><circle cx="140" cy="175" r="11" fill="white" stroke="#334155" stroke-width="1.6"/><path d="M140,186 V212 M110,199 H170 M140,212 L115,236 M140,212 L165,236" fill="none" stroke="#334155" stroke-width="1.6"/><text fill="#223046" font-family="Arial,sans-serif" font-size="14" text-anchor="middle"><tspan x="140" y="253.6">Responsable de admisión</tspan><tspan x="140" y="270.4">hospitalaria</tspan></text><circle cx="140" cy="445" r="11" fill="white" stroke="#334155" stroke-width="1.6"/><path d="M140,456 V482 M110,469 H170 M140,482 L115,506 M140,482 L165,506" fill="none" stroke="#334155" stroke-width="1.6"/><text fill="#223046" font-family="Arial,sans-serif" font-size="14" text-anchor="middle"><tspan x="140" y="523.6">Gestor de camas