<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1070" role="img"><title>Facturación e informes  |  Catálogo general</title><desc>Vista parcial del mismo sujeto SIGH. Las seis vistas cubren los 23 casos del catálogo sin alterar su numeración. Las asociaciones agregan la participación en el detalle; no conceden permisos de todo el módulo. Cargar servicios y emitir documentos son objetivos independientes. Calcular importes es comportamiento incluido al emitir, sin convertir al cálculo automático en una interacción del facturador. Caja y facturación tienen responsabilidades separadas. Una devolución posterior no es automáticamente extend de Registrar pago; no se ha especificado un punto de extensión dentro de esa ejecución. Se elimina Seleccionar tipo de informe como caso incluido desde cada informe ya tipado, junto con sus flechas invertidas. Los filtros forman parte del flujo de cada consulta. La exportación es un objetivo independiente, con informe autorizado como precondición.</desc><defs><marker id="arrow" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M1,1 L10,5 L1,9" fill="none" stroke="#334155" stroke-width="1.3"/></marker></defs><rect width="100%" height="100%" fill="white"/><rect x="345" y="100" width="950" height="855" fill="white" stroke="#334155" stroke-width="1.6"/><polyline points="170,199 540,205" fill="none" stroke="#334155" stroke-width="1.3"/><polyline points="170,199 543.92,550" fill="none" stroke="#334155" stroke-width="1.3"/><polyline points="170,199 567.653,899.493" fill="none" stroke="#334155" stroke-width="1.3"/><polyline points="1420,199 1096.08,535" fill="none" stroke="#334155" stroke-width="1.3"/><polyline points="1420,199 1072.35,860.507" fill="none" stroke="#334155" stroke-width="1.3"/><polyline points="170,536.507 626.333,847.493" fill="none" stroke="#334155" stroke-width="1.3"/><polyline points="1420,536.507 1097.07,873.493" fill="none" stroke="#334155" stroke-width="1.3"/><polyline points="170,874 