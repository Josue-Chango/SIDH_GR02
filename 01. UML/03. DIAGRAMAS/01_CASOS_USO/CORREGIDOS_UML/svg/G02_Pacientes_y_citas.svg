<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 800" role="img"><title>Pacientes, citas y admisión  |  Catálogo general</title><desc>Vista parcial del mismo sujeto SIGH. Las seis vistas cubren los 23 casos del catálogo sin alterar su numeración. Las asociaciones agregan la participación en el detalle; no conceden permisos de todo el módulo. El paciente aporta información al proceso hospitalario; no interactúa con el software en el alcance base. La asignación de la función de depuración a admisión es una propuesta de responsabilidad que debe ratificarse. Consultar, reservar, reprogramar y cancelar son objetivos independientes. El diagrama no impone que consultar una agenda ejecute una reserva. CU-06 se concreta como admisión administrativa. CU-17 se ocupa de camas y egreso; la llegada a consulta externa se registra en CU-05. La ERS no define un RF independiente para verificar cobertura externa.</desc><defs><marker id="arrow" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M1,1 L10,5 L1,9" fill="none" stroke="#334155" stroke-width="1.3"/></marker></defs><rect width="100%" height="100%" fill="white"/><rect x="345" y="100" width="950" height="585" fill="white" stroke="#334155" stroke-width="1.6"/><polyline points="170,199 543.92,212.507" fill="none" stroke="#334155" stroke-width="1.3"/><polyline points="170,199 543.92,415" fill="none" stroke="#334155" stroke-width="1.3"/><polyline points="1420,199 1096.08,197.493" fill="none" stroke="#334155" stroke-width="1.3"/><polyline points="1420,199 1096.08,602.507" fill="none" stroke="#334155" stroke-width="1.3"/><polyline points="170,604 543.92,400" fill="none" stroke="#334155" stroke-width="1.3"/><polyline points="1420,604 1096.08,617.493" fill="none" stroke="#334155" stroke-width="1.3"/><text fill="#223046" font-family="Arial,sans-serif" font-size="22" font-weight="700" text-anchor="middle"><tspan x="800" y="37.5">Pacientes, citas y admisión | Catálogo general</tspan></text><text fill="#223046" font-family="Arial,sans-serif" font-size="16" font-weight="700" text-anchor="middle"><tspan x="820" y="129.5">SIGH | Hospital General Monster Salud</tspan></text><text fill="#223046" font-family="Arial,sans-serif" font-size="12" text-anchor="middle"><tspan x="800" y="735">Sesión y permisos válidos para operaciones protegidas. Las asociaciones no representan orden temporal.</tspan></text><circle cx="140" cy="175" r="11" fill="white" stroke="#334155" stroke-width="1.6"/><path d="M140,186 V212 M110,199 H170 M140,212 L115,236 M140,212 L165,236" fill="none" stroke="#334155" stroke-width="1.6"/><text fill="#223046" font-family="Arial,sans-serif" font-size="14" text-anchor="middle"><tspan x="140" y="262">Recepcionista</tspan></text><circle cx="1450" cy="175" r="11" fill="white" stroke="#334155" stroke-width="1.6"/><path d="M1450,186 V212 M1420,199 H1480 M1450,212 L1425,236 M1450,212 L1475,236" fill="none" stroke="#334155" stroke-width="1.6"/><text fill="#223046" font-family="Arial,sans-serif" font-size="14" text-anchor="middle"><tspan x="1450" y="253.6">Responsable de admisión</tspan><tspan x="1450" y="270.4">hospitalaria</tspan></text><circle cx="140" cy="580" r="11" fill="white" stroke="#334155" stroke-width="1.6"/><path d="M140,591 V617 M110,604 H170 M140,617 L115,641 M140,617 L165,641" fill="none" stroke="#334155" stroke-width="1.6"/><text fill="#223046" font-family="Arial,sans-serif" font-size="14" text-anchor="middle"><tspan x="140" y="667">Médico</tspan></text><circle cx="1450" cy="580" r="11" fill="white" stroke="#334155" stroke-width="1.6"/><path d="M1450,591 V617 M1420,604 H1480 M1450,617 L1425,641 M1450,617 L1475,641" fill="none" stroke="#334155" stroke-width="1.6"/><text fill="#223046" font-family="Arial,sans-serif" font-size="14" text-anchor="middle"><tspan x="1450" y="658.6">Gestor de camas y</tspan><tspan x="1450" y="675.4">hospitalización</tspan></text><ellipse cx="820" cy="205" rx="280" ry="45" fill="#eff6ff" stroke="#334155" stroke-width="1.4"/><text fill="#223046" font-family="Arial,sans-serif" font-size="15" text-anchor="middle"><tspan x="820" y="201">CU-04</tspan><tspan x="820" y="219">Registrar y actualizar pacientes</tspan></text><ellipse cx="820" cy="407.507" rx="280" ry="45" fill="#eff6ff" stroke="#334155" stroke-width="1.4"/><text fill="#223046" font-family="Arial,sans-serif" font-size="15" text-anchor="middle"><tspan x="820" y="403.507">CU-05</tspan><tspan x="820" y="421.507">Gestionar citas médicas</tspan></text><ellipse cx="820" cy="610" rx="280" ry="45" fill="#eff6ff" stroke="#334155" stroke-width="1.4"/><text fill="#223046" font-family="Arial,sans-serif" font-size="15" text-anchor="middle"><tspan x="820" y="606">CU-06</tspan><tspan x="820" y="624">Admitir pacientes</tspan></text></svg>