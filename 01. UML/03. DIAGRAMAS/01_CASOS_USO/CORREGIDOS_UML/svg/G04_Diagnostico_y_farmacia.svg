<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1070" role="img"><title>Diagnóstico y farmacia  |  Catálogo general</title><desc>Vista parcial del mismo sujeto SIGH. Las seis vistas cubren los 23 casos del catálogo sin alterar su numeración. Las asociaciones agregan la participación en el detalle; no conceden permisos de todo el módulo. Seleccionar exámenes es parte del flujo de solicitud. No se fuerza la consulta de resultados como parte de solicitar un examen. El personal del hospital es el actor; un laboratorio externo solo se incorporaría con integración aprobada. Guardar resultados y validarlos son objetivos separados. Un include entre ambos impondría validación cada vez que se guarda un borrador y confundiría responsabilidades. El actor Profesional de imagenología representa funciones con habilitaciones distintas. Su asociación no autoriza a todo técnico a interpretar o validar un informe. Se separan la prescripción médica y su verificación para dispensación. Consultar un catálogo no obliga a emitir una receta. Los include representan verificaciones y efectos obligatorios de la dispensación, con la flecha desde el caso base hacia el comportamiento incluido. El sistema genera automáticamente las alertas de RF-FAR-007. El farmacéutico configura umbrales y consulta el resultado, no ejecuta manualmente el evento automático.</desc><defs><marker id="arrow" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M1,1 L10,5 L1,9" fill="none" stroke="#334155" stroke-width="1.3"/></marker></defs><rect width="100%" height="100%" fill="white"/><rect x="345" y="100" width="950" height="855" fill="white" stroke="#334155" stroke-width="1.6"/><polyline points="170,199 543.92,332.507" fill="none" stroke="#334155" stroke-width="1.3"/><polyline points="1420,199 1100,205" fill="none" stroke="#334155" stroke-width="1.3"/><polyline points="1420,199 1096.08,347.493" fill="none" stroke="#334155" stroke-width="1.3"/><polyline points="1420,199 1096.08,482.507" fill="none" stroke="#334155" stroke-width="1.3"/><polyline points="1420,199 1096.08,617.493" fill="none" stroke="#334155" stroke-width="1.3"/><polyline points="170,874 543.92,467.493" fill="none" stroke="#334155" stroke-width="1.3"/><polyline points="1420,874 1096.08,602.507" fill="none" stroke="#334155" stroke-width="1.3"/><polyline points="1420,874 1100,745" fill="none" stroke="#334155" stroke-width="1.3"/><polyline points="1420,874 1100,880" fill="none" stroke="#334155" stroke-width="1.3"/><text fill="#223046" font-family="Arial,sans-serif" font-size="22" font-weight="700" text-anchor="middle"><tspan x="800" y="37.5">Diagnóstico y farmacia | Catálogo general</tspan></text><text fill="#223046" font-family="Arial,sans-serif" font-size="16" font-weight="700" text-anchor="middle"><tspan x="820" y="129.5">SIGH | Hospital General Monster Salud</tspan></text><text fill="#223046" font-family="Arial,sans-serif" font-size="12" text-anchor="middle"><tspan x="800" y="1005">Sesión y permisos válidos para operaciones protegidas. Las asociaciones no representan orden temporal.</tspan></text><circle cx="140" cy="175" r="11" fill="white" stroke="#334155" stroke-width="1.6"/><path d="M140,186 V212 M110,199 H170 M140,212 L115,236 M140,212 L165,236" fill="none" stroke="#334155" stroke-width="1.6"/><text fill="#223046" font-family="Arial,sans-serif" font-size="14" text-anchor="middle"><tspan x="140" y="262">Personal de laboratorio</tspan></text><circle cx="1450" cy="175" r="11" fill="white" stroke="#334155" stroke-width="1.6"/><path d="M1450,186 V212 M1420,199 H1480 M1450,212 L1425,236 M1450,212 L1475,236" fill="none" stroke="#334155" stroke-width="1.6"/><text fill="#223046" font-family="Arial,sans-serif" font-size="14" text-anchor="middle"><tspan x="1450" y="262">Médico</tspan></text><circle cx="140" cy="850" r="11" fill="white" stroke="#334155" stroke-width="1.6"/><path d="M140,861 V887 M110,874 H170 M140,887 L115,911 M140,887 L165,911" fill="none" stroke="#334155" stroke-width="1.6"/><text fill="#223046" font-family="Arial,sans-serif" font-size="14" text-anchor="middle"><tspan x="140" y="937">Profesional de imagenología</tspan></text><circle cx="1450" cy="850" r="11" fill="white" stroke="#334155" stroke-width="1.6"/><path d="M1450,861 V887 M1420,874 H1480 M1450,887 L1425,911 M1450,887 L1475,911" fill="none" stroke="#334155" stroke-width="1.6"/><text fill="#223046" font-family="Arial,sans-serif" font-size="14" text-anchor="middle"><tspan x="1450" y="937">Farmacéutico</tspan></text><ellipse cx="820" cy="205" rx="280" ry="45" fill="#eff6ff" stroke="#334155" stroke-width="1.4"/><text fill="#223046" font-family="Arial,sans-serif" font-size="15" text-anchor="middle"><tspan x="820" y="201">CU-11</tspan><tspan x="820" y="219">Solicitar exámenes de laboratorio</tspan></text><ellipse cx="820" cy="340" rx="280" ry="45" fill="#eff6ff" stroke="#334155" stroke-width="1.4"/><text fill="#223046" font-family="Arial,sans-serif" font-size="15" text-anchor="middle"><tspan x="820" y="336">CU-12</tspan><tspan x="820" y="354">Registrar resultados de laboratorio</tspan></text><ellipse cx="820" cy="475" rx="280" ry="45" fill="#eff6ff" stroke="#334155" stroke-width="1.4"/><text fill="#223046" font-family="Arial,sans-serif" font-size="15" text-anchor="middle"><tspan x="820" y="471">CU-13</tspan><tspan x="820" y="489">Gestionar estudios de imagenología</tspan></text><ellipse cx="820" cy="610" rx="280" ry="45" fill="#eff6ff" stroke="#334155" stroke-width="1.4"/><text fill="#223046" font-family="Arial,sans-serif" font-size="15" text-anchor="middle"><tspan x="820" y="606">CU-14</tspan><tspan x="820" y="624">Gestionar recetas médicas</tspan></text><ellipse cx="820" cy="745" rx="280" ry="45" fill="#eff6ff" stroke="#334155" stroke-width="1.4"/><text fill="#223046" font-family="Arial,sans-serif" font-size="15" text-anchor="middle"><tspan x="820" y="741">CU-15</tspan><tspan x="820" y="759">Dispensar medicamentos</tspan></text><ellipse cx="820" cy="880" rx="280" ry="45" fill="#eff6ff" stroke="#334155" stroke-width="1.4"/><text fill="#223046" font-family="Arial,sans-serif" font-size="15" text-anchor="middle"><tspan x="820" y="876">CU-16</tspan><tspan x="820" y="894">Gestionar inventario de farmacia</tspan></text></svg>