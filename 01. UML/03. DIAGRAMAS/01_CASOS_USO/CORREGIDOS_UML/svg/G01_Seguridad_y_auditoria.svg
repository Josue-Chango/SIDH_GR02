<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 800" role="img"><title>Seguridad y administración  |  Catálogo general</title><desc>Vista parcial del mismo sujeto SIGH. Las seis vistas cubren los 23 casos del catálogo sin alterar su numeración. Las asociaciones agregan la participación en el detalle; no conceden permisos de todo el módulo. La autenticación es un objetivo propio. En los demás módulos una sesión válida es una precondición; no se repite un include a Iniciar sesión. No se presupone servicio externo de identidad ni soporte con privilegios de restablecimiento. Se distinguen la modificación administrativa y la supervisión de seguridad. Las operaciones requieren sesión y permisos; la consulta no implica facultades de edición. Los cambios de configuración se registran automáticamente. La auditoría es una obligación del comportamiento, no una tarea que el administrador deba ejecutar manualmente. La generación y protección de bitácoras son reglas transversales del sistema. No se presentan como tareas del auditor ni como actores internos.</desc><defs><marker id="arrow" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M1,1 L10,5 L1,9" fill="none" stroke="#334155" stroke-width="1.3"/></marker></defs><rect width="100%" height="100%" fill="white"/><rect x="345" y="100" width="950" height="585" fill="white" stroke="#334155" stroke-width="1.6"/><polyline points="170,199 540,205" fill="none" stroke="#334155" stroke-width="1.3"/><polyline points="1420,199 1096.08,332.507" fill="none" stroke="#334155" stroke-width="1.3"/><polyline points="1420,199 1100,475" fill="none" stroke="#334155" stroke-width="1.3"/><polyline points="1420,199 1083.99,595" fill="none" stroke="#334155" stroke-width="1.3"/><polyline points="170,604 543.92,347.493" fill="none" stroke="#334155" stroke-width="1.3"/><polyline points="170,604 556.013,625" fill="none" stroke="#334155" stroke-width="1.3"/><polyline points="1420,604 1100,610" fill="none" stroke="#334155" stroke-width="1.3"/><text fill="#223046" font-family="Arial,sans-serif" font-size="22" font-weight="700" text-anchor="middle"><tspan x="800" y="37.5">Seguridad y administración | Catálogo general</tspan></text><text fill="#223046" font-family="Arial,sans-serif" font-size="16" font-weight="700" text-anchor="middle"><tspan x="820" y="129.5">SIGH | Hospital General Monster Salud</tspan></text><text fill="#223046" font-family="Arial,sans-serif" font-size="12" text-anchor="middle"><tspan x="800" y="735">Sesión y permisos válidos para operaciones protegidas. Las asociaciones no representan orden temporal.</tspan></text><circle cx="140" cy="175" r="11" fill="white" stroke="#334155" stroke-width="1.6"/><path d="M140,186 V212 M110,199 H170 M140,212 L115,236 M140,212 L165,236" fill="none" stroke="#334155" stroke-width="1.6"/><text fill="#223046" font-family="Arial,sans-serif" font-size="14" text-anchor="middle"><tspan x="140" y="262">Usuario del sistema</tspan></text><circle cx="1450" cy="175" r="11" fill="white" stroke="#334155" stroke-width="1.6"/><path d="M1450,186 V212 M1420,199 H1480 M1450,212 L1425,236 M1450,212 L1475,236" fill="none" stroke="#334155" stroke-width="1.6"/><text fill="#223046" font-family="Arial,sans-serif" font-size="14" text-anchor="middle"><tspan x="1450" y="262">Administrador del sistema</tspan></text><circle cx="140" cy="580" r="11" fill="white" stroke="#334155" stroke-width="1.6"/><path d="M140,591 V617 M110,604 H170 M140,617 L115,641 M140,617 L165,641" fill="none" stroke="#334155" stroke-width="1.6"/><text fill="#223046" font-family="Arial,sans-serif" font-size="14" text-anchor="middle"><tspan x="140" y="667">Responsable de seguridad</tspan></text><circle cx="1450" cy="580" r="11" fill="white" stroke="#334155" stroke-width="1.6"/><path d="M1450,591 V617 M1420,604 H1480 M1450,617 L1425,641 M1450,617 L1475,641" fill="none" stroke="#334155" stroke-width="1.6"/><text fill="#223046" font-family="Arial,sans-serif" font-size="14" text-anchor="middle"><tspan x="1450" y="667">Auditor</tspan></text><ellipse cx="820" cy="205" rx="280" ry="45" fill="#eff6ff" stroke="#334155" stroke-width="1.4"/><text fill="#223046" font-family="Arial,sans-serif" font-size="15" text-anchor="middle"><tspan x="820" y="201">CU-01</tspan><tspan x="820" y="219">Iniciar sesión</tspan></text><ellipse cx="820" cy="340" rx="280" ry="45" fill="#eff6ff" stroke="#334155" stroke-width="1.4"/><text fill="#223046" font-family="Arial,sans-serif" font-size="15" text-anchor="middle"><tspan x="820" y="336">CU-02</tspan><tspan x="820" y="354">Gestionar usuarios, roles y permisos</tspan></text><ellipse cx="820" cy="475" rx="280" ry="45" fill="#eff6ff" stroke="#334155" stroke-width="1.4"/><text fill="#223046" font-family="Arial,sans-serif" font-size="15" text-anchor="middle"><tspan x="820" y="471">CU-03</tspan><tspan x="820" y="489">Administrar catálogos y parámetros</tspan></text><ellipse cx="820" cy="610" rx="280" ry="45" fill="#eff6ff" stroke="#334155" stroke-width="1.4"/><text fill="#223046" font-family="Arial,sans-serif" font-size="15" text-anchor="middle"><tspan x="820" y="606">CU-23</tspan><tspan x="820" y="624">Consultar auditoría y trazabilidad</tspan></text></svg>