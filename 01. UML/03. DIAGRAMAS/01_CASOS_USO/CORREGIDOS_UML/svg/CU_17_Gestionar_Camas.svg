<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1350 935" role="img"><title>CU-17  Gestionar camas y hospitalización</title><desc>CU-06 registra la admisión. CU-19 corresponde a la decisión y documentación médica. El egreso actualiza la cama respetando limpieza o preparación; no equivale a disponibilidad inmediata.
