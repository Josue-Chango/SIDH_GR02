<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1350 665" role="img"><title>CU-01  Iniciar sesión</title><desc>La autenticación es un objetivo propio. En los demás módulos una sesión válida es una precondición; no se repite un include a Iniciar sesión. No se presupone servicio externo de identidad ni soporte con privilegios de restablecimiento.
RF-SEG-004: Inicio, expiración, cierre e inactividad conforme a la política institucional.
RF-AUD-001: Registrar eventos de autenticación, recuperación y cierre definidos por la política.
RF-AUD-004: Registrar los intentos denegados relevantes sin contraseñas ni secretos.</desc><defs><marker id="arrow" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M1,1 L10,5 L1,9" fill="none" stroke="#334155" stroke-width="1.3"/></marker></defs><rect width="100%" height="100%" fill="white"/><rect x="345" y="100" width="950" height="450" fill="white" stroke="#334155" stroke-width="1.6"/><polyline points="170,334 445,205" fill="none" stroke="#334155" stroke-width="1.3"/><polyline points="170,334 445,340" fill="none" stroke="#334155" stroke-width="1.3"/><polyline points="170,334 445,475" fill="none" stroke="#334155" stroke-width="1.3"/><polyline points="805,205 850,205 850,205 945,205" fill="none" stroke="#334155" stroke-width="1.3" stroke-dasharray="7 5" marker-end="url(#arrow)"/><text fill="#223046" font-family="Arial,sans-serif" font-size="13" text-anchor="middle"><tspan x="897.5" y="193">«include»</tspan></text><polyline points="805,475 862,475 862,475 945,475" fill="none" stroke="#334155" stroke-width="1.3" stroke-dasharray="7 5" marker-end="url(#arrow)"/><text fill="#223046" font-family="Arial,sans-serif" font-size="13" text-anchor="middle"><tspan x="903.5" y="463">«include»</tspan></text><text fill="#223046" font-family="Arial,sans-serif" font-size="22" font-weight="700" text-anchor="middle"><tspan x="675" y="37.5">CU-01 Iniciar sesión</tspan></text><text fill="#223046" font-family="Arial,sans-serif" font-size="16" font-weight="700" text-anchor="middle"><tspan x="820" y="129.5">SIGH | Hospital General Monster Salud</tspan></text><text fill="#223046" font-family="Arial,sans-serif" font-size="12" text-anchor="middle"><tspan x="675" y="600">Sesión y permisos válidos para operaciones protegidas. Las asociaciones no representan orden temporal.</tspan></text><circle cx="140" cy="310" r="11" fill="white" stroke="#334155" stroke-width="1.6"/><path d="M140,321 V347 M110,334 H170 M140,347 L115,371 M140,347 L165,371" fill="none" stroke="#334155" stroke-width="1.6"/><text fill="#223046" font-family="Arial,sans-serif" font-size="14" text-anchor="middle"><tspan x="140" y="397">Usuario del sistema</tspan></text><ellipse cx="625" cy="205" rx="180" ry="45" fill="#eff6ff" stroke="#334155" stroke-width="1.4"/><text fill="#223046" font-family="Arial,sans-serif" font-size="10" text-anchor="middle"><tspan x="625" y="178">CU-01.01</tspan></text><text fill="#223046" font-family="Arial,sans-serif" font-size="15" text-anchor="middle"><tspan x="625" y="210">Iniciar sesión</tspan></text><ellipse cx="625" cy="340" rx="180" ry="45" fill="#eff6ff" stroke="#334155" stroke-width="1.4"/><text fill="#223046" font-family="Arial,sans-serif" font-size="10" text-anchor="middle"><tspan x="625" y="313">CU-01.02</tspan></text><text fill="#223046" font-family="Arial,sans-serif" font-size="15" text-anchor="middle"><tspan x="625" y="345">Cerrar sesión</tspan></text><ellipse cx="625" cy="475" rx="180" ry="45" fill="#eff6ff" stroke="#334155" stroke-width="1.4"/><text fill="#223046" font-family="Arial,sans-serif" font-size="10" text-anchor="middle"><tspan x="625" y="448">CU-01.03</tspan></text><text fill="#223046" font-family="Arial,sans-serif" font-size="15" text-anchor="middle"><tspan x="625" y="480">Recuperar o restablecer credenciales</tspan></text><ellipse cx="1100" cy="205" rx="155" ry="45" fill="#f1f5f9" stroke="#334155" stroke-width="1.4"/><text fill="#223046" font-family="Arial,sans-serif" font-size="10" text-anchor="middle"><tspan x="1100" y="178">CU-01.04</tspan></text><text fill="#223046" font-family="Arial,sans-serif" font-size="15" text-anchor="middle"><tspan x="1100" y="210">Verificar credenciales</tspan></text><ellipse cx="1100" cy="475" rx="155" ry="45" fill="#f1f5f9" stroke="#334155" stroke-width="1.4"/><text fill="#223046" font-family="Arial,sans-serif" font-size="10" text-anchor="middle"><tspan x="1100" y="448">CU-01.05</tspan></text><text fill="#223046" font-family="Arial,sans-serif" font-size="15" text-anchor="middle">