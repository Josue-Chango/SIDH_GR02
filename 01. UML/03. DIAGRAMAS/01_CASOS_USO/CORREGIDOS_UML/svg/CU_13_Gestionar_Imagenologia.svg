<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1350 1070" role="img"><title>CU-13  Gestionar estudios de imagenología</title><desc>El actor Profesional de imagenología representa funciones con habilitaciones distintas. Su asociación no autoriza a todo técnico a interpretar o validar un informe.
