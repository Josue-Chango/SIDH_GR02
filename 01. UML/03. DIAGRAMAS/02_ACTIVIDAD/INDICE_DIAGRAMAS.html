<!doctype html><html lang="es"><meta charset="utf-8"><title>Diagramas de actividad del SIGH</title><style>body{margin:0;font:16px Arial;color:#14233a;background:#f1f5f9}header{position:sticky;top:0;background:white;padding:18px 24px;border-bottom:1px solid #cbd5e1;display:flex;gap:18px;align-items:center;flex-wrap:wrap}select,button,a{font:inherit}select{padding:8px;max-width:70vw}main{padding:24px;text-align:center}img{max-width:100%;height:auto;background:white}a{color:#164ba0}</style><header><strong>Actividades del SIGH</strong><select id="sel" aria-label="Seleccionar diagrama"></select><a id="original" target="_blank">Abrir SVG</a><a href="DIAGRAMAS_ACTIVIDAD_CORREGIDOS.pdf">Ver PDF completo</a></header><main><img id="img" alt="Diagrama de actividad seleccionado"></main><script>const items=[{"id": "CU01", "title": "Iniciar sesión", "file": "svg/DA_CU01_Iniciar_Sesion.svg"}, {"id": "CU01a", "title": "Recuperar o restablecer credenciales", "file": "svg/DA_CU01_Iniciar_Sesion_a.svg"}, {"id": "CU01b", "title": "Cerrar o expirar una sesión", "file": "svg/DA_CU01_Iniciar_Sesion_b.svg"}, {"id": "CU02", "title": "Administrar cuentas de usuario", "file": "svg/DA_CU02_Gestionar_Usuarios_Roles.svg"}, {"id": "CU02a", "title": "Gestionar permisos y políticas de sesión", "file": "svg/DA_CU02_Gestionar_Usuarios_Roles_a.svg"}, {"id": "CU03", "title": "Administrar catálogos institucionales", "file": "svg/DA_CU03_Administrar_Catalogos.svg"}, {"id": "CU04", "title": "Registrar y actualizar pacientes", "file": "svg/DA_CU04_Registrar_Pacientes.svg"}, {"id": "CU04a", "title": "Resolver posibles duplicados", "file": "svg/DA_CU04_Registrar_Pacientes_a.svg"}, {"id": "CU05", "title": "Programar o reprogramar citas", "file": "svg/DA_CU05_Gestionar_Citas.svg"}, {"id": "CU05a", "title": "Gestionar agendas y estados de cita", "file": "svg/DA_CU05_Gestionar_Citas_a.svg"}, {"id": "CU06", "title": "Admitir pacientes y consultar ingresos", "file": "svg/DA_CU06_Admitir_Pacientes.svg"}, {"id": "CU07", "title": "Consultar historia clínica electrónica", "file": "svg/DA_CU07_Consultar_HCE.svg"}, {"id": "CU08", "title": "Registrar consulta y finalizar nota clínica", "file": "svg/DA_CU08_Registrar_Consulta.svg"}, {"id": "CU08a", "title": "Registrar evoluciones y documentos clínicos", "file": "svg/DA_CU08_Registrar_Consulta_a.svg"}, {"id": "CU09", "title": "Registrar signos vitales y cuidados", "file": "svg/DA_CU09_Registrar_Signos_Vitales.svg"}, {"id": "CU10", "title": "Registrar atención de urgencias", "file": "svg/DA_CU10_Gestionar_Urgencias.svg"}, {"id": "CU10a", "title": "Conciliar identidad temporal de emergencia", "file": "svg/DA_CU10_Gestionar_Urgencias_a.svg"}, {"id": "CU11", "title": "Solicitar laboratorio o consultar resultados", "file": "svg/DA_CU11_Solicitar_Laboratorio.svg"}, {"id": "CU12", "title": "Procesar y validar resultados de laboratorio", "file": "svg/DA_CU12_Registrar_Resultados_Lab.svg"}, {"id": "CU13", "title": "Gestionar estudios de imagenología", "file": "svg/DA_CU13_Gestionar_Imagenologia.svg"}, {"id": "CU14", "title": "Registrar y consultar prescripciones", "file": "svg/DA_CU14_Gestionar_Recetas.svg"}, {"id": "CU15", "title": "Dispensar medicamentos", "file": "svg/DA_CU15_Dispensar_Medicamentos.svg"}, {"id": "CU16", "title": "Gestionar inventario de farmacia", "file": "svg/DA_CU16_Gestionar_Inventario.svg"}, {"id": "CU17", "title": "Asignar cama o registrar traslado", "file": "svg/DA_CU17_Gestionar_Camas.svg"}, {"id": "CU17a", "title": "Administrar estados de cama y egreso", "file": "svg/DA_CU17_Gestionar_Camas_a.svg"}, {"id": "CU18", "title": "Programar y registrar cirugía", "file": "svg/DA_CU18_Gestionar_Quirofano.svg"}, {"id": "CU19", "title": "Registrar alta médica autorizada", "file": "svg/DA_CU19_Registrar_Alta.svg"}, {"id": "CU20", "title": "Generar documento de facturación", "file": "svg/DA_CU20_Generar_Facturas.svg"}, {"id": "CU21", "title": "Registrar pagos y consultar saldo", "file": "svg/DA_CU21_Registrar_Pagos.svg"}, {"id"
