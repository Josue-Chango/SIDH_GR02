<text x="45" y="82" font-family="Arial,sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#0f172a">Caso de uso: CU-01.02</text>
<text x="45" y="100" font-family="Arial,sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#0f172a">Requisitos: RF-AUD-001, RF-AUD-003, RF-AUD-004, RF-SEG-004</text>
<text x="45" y="118" font-family="Arial,sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#0f172a">Actor de esta secuencia: Usuario del sistema</text>
