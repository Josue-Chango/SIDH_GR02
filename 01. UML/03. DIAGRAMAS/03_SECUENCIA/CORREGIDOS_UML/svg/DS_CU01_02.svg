<svg xmlns="http://www.w3.org/2000/svg" width="1195" height="1081" viewBox="0 0 1195 1081" role="img" aria-labelledby="title desc">
<title id="title">DS_CU01.02 Cerrar sesión</title>
<desc id="desc">Secuencia UML. Llamadas síncronas, respuestas, activaciones y alternativas con guardas. Invalida la sesión. La expiración y el límite de inactividad son controles automáticos; una sesión cerrada o expirada exige nueva autenticación.</desc>
