<title id="title">DS_CU01.01 Iniciar sesión</title>
<desc id="desc">Secuencia UML. Llamadas síncronas, respuestas, activaciones y alternativas con guardas. Recibe credenciales individuales; la cuenta debe estar activa y no bloqueada. Crea una sesión segura o devuelve un error genérico.</desc>
